services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: news-postgres
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    ports:
      - "5432:5432"
    volumes:
      - ./.data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: news-redis
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rsshub:
    image: diygod/rsshub:latest
    container_name: news-rsshub
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
    depends_on:
      - redis

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: news-web
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://news:news@postgres:5432/news
      REDIS_URL: redis://redis:6379
      RSSHUB_BASE: http://rsshub:1200
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # worker 在 M1 加入
